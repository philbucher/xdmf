[profile.default]
# Do not exit the test run until all tests complete.
fail-fast = false

# Each `mpi_np_N` test (see `tests/writer_mpi.rs`) launches N MPI ranks, which busy-wait; count it
# as N test threads so they are not oversubscribed. A hung collective should fail the test rather
# than the CI job, hence the timeout.
[[profile.default.overrides]]
filter = 'test(/mpi_np_2$/)'
threads-required = 2
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'test(/mpi_np_3$/)'
threads-required = 3
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'test(/mpi_np_1$/)'
slow-timeout = { period = "60s", terminate-after = 2 }
