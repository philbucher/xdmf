[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "xdmf"
dynamic = ["version"] # takes it from root Cargo.toml
description = "Python bindings for the xdmf crate: write XDMF files for ParaView"
readme = "README.md"
license = "MIT"
authors = [{ name = "Philipp Bucher" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["xdmf", "paraview", "visit", "hdf5", "postprocessing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Repository = "https://github.com/philbucher/xdmf"
Issues = "https://github.com/philbucher/xdmf/issues"

[project.optional-dependencies]
test = ["pytest", "h5py"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "xdmf"
features = ["pyo3/extension-module"]
