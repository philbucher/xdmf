[package]
name = "xdmf-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "xdmf"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
# `default-features = false` + explicit `features = ["hdf5"]` (rather than just leaving the
# crate's own default on) so a future default-feature addition on the core crate doesn't get
# silently pulled into the wheel unnoticed.
xdmf = { version = "0.1.3", path = "..", default-features = false, features = ["hdf5"] }
