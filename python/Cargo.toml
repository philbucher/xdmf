[package]
name = "xdmf-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "xdmf"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
# HDF5 storage is intentionally excluded from the Python bindings for now (avoids requiring
# CMake to build the wheel, see PYTHON_BINDINGS_PLAN.md) -- default-features off drops it.
xdmf = { version = "0.1.3", path = "..", default-features = false }
