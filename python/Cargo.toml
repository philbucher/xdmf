[package]
name = "xdmf-python"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "xdmf"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
# `default-features = false` + explicit `features = ["hdf5"]` (rather than just leaving the
# crate's own default on) so a future default-feature addition on the core crate doesn't get
# silently pulled into the wheel unnoticed.
xdmf = { path = "..", default-features = false, features = ["hdf5"] }
