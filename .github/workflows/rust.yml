name: Rust

permissions:
  contents: read

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    name: "Building and testing with default features: ${{ matrix.default_features }}"
    strategy:
      fail-fast: false
      matrix:
        default_features: [YES, NO]

    steps:
    - uses: actions/checkout@v7

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: "features-${{ matrix.default_features }}"

    - uses: taiki-e/install-action@v2
      with:
        tool: nextest

    - name: Install feature dependencies
      if: ${{ matrix.default_features == 'YES' }}
      run: |
        sudo apt-get remove -y man-db || true # to speed up
        sudo apt-get update
        sudo apt-get install libhdf5-dev --no-install-recommends

    - name: Run clippy
      run: |
        if [ "${{ matrix.default_features }}" == 'YES' ]; then
          cargo clippy --all-targets -- -D warnings
        else
          cargo clippy --all-targets --no-default-features -- -D warnings
        fi

    - name: Run tests (debug mode)
      if: ${{ matrix.default_features == 'YES' }}
      run: cargo nextest run

    - name: Run tests (release mode)
      if: ${{ matrix.default_features == 'YES' }}
      run: cargo nextest run --release

    - name: Run doc tests # nextest does not support doc tests, thus running them separately
      if: ${{ matrix.default_features == 'YES' }}
      run: cargo test --doc

    - name: Check Docs # docs need dependencies to be installed, thus checking them after installing dependencies
      if: ${{ matrix.default_features == 'YES' }}
      run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc --no-deps --document-private-items

  test-cross-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    name: "Testing on ${{ matrix.os }} (no default features)"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: "cross-platform-${{ matrix.os }}"

    - uses: taiki-e/install-action@v2
      with:
        tool: nextest

    - name: Run tests (debug mode)
      run: cargo nextest run --no-default-features

    - name: Run tests (release mode)
      run: cargo nextest run --no-default-features --release

    - name: Run doc tests # nextest does not support doc tests, thus running them separately
      run: cargo test --no-default-features --doc

  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        components: rustfmt

    - name: Check formatting
      run: cargo +nightly fmt --all --check

  spelling:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    - name: Check spelling
      uses: crate-ci/typos@v1.48.0
