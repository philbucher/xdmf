name: Rust

permissions:
  contents: read

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    name: "Building and testing on ${{ matrix.os }} (hdf5: ${{ matrix.hdf5 }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        hdf5: [YES, NO]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        components: clippy

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: "cross-platform-${{ matrix.os }}-${{ matrix.hdf5 }}"

    - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
      with:
        tool: nextest

    - name: Install HDF5 (apt)
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.hdf5 == 'YES' }}
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get remove -y man-db || true # to speed up
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libhdf5-dev

    - name: Install HDF5 (Homebrew)
      if: ${{ matrix.os == 'macos-latest' && matrix.hdf5 == 'YES' }}
      run: |
        brew install hdf5
        echo "HDF5_DIR=$(brew --prefix hdf5)" >> "$GITHUB_ENV"

    # vcpkg builds HDF5 (and zlib and szip) from source, which is by far the longest step of the
    # Windows job -- so the tree it installs into is cached, keyed on the runner image's own vcpkg
    # commit, and `vcpkg install` only runs when that key misses.
    - name: Locate the vcpkg HDF5 installation
      if: ${{ matrix.os == 'windows-latest' && matrix.hdf5 == 'YES' }}
      shell: pwsh
      run: |
        $hdf5Dir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
        echo "HDF5_DIR=$hdf5Dir" >> $env:GITHUB_ENV
        echo "$hdf5Dir\bin" >> $env:GITHUB_PATH
        $rev = git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD
        if (-not $rev) { throw "cannot determine the vcpkg revision, refusing to cache blindly" }
        echo "VCPKG_REV=$rev" >> $env:GITHUB_ENV

    - name: Cache the vcpkg HDF5 build
      id: hdf5-cache
      if: ${{ matrix.os == 'windows-latest' && matrix.hdf5 == 'YES' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.HDF5_DIR }}
        key: vcpkg-hdf5-x64-windows-${{ env.VCPKG_REV }}

    - name: Install HDF5 (vcpkg)
      if: ${{ matrix.os == 'windows-latest' && matrix.hdf5 == 'YES' && steps.hdf5-cache.outputs.cache-hit != 'true' }}
      shell: pwsh
      run: vcpkg install hdf5:x64-windows

    - name: Run clippy
      shell: bash
      run: |
        if [ "${{ matrix.hdf5 }}" == 'YES' ]; then
          cargo clippy --locked --all-targets -- -D warnings
        else
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
        fi

    - name: Run tests (debug mode)
      shell: bash
      run: |
        if [ "${{ matrix.hdf5 }}" == 'YES' ]; then
          cargo nextest run --locked
        else
          cargo nextest run --locked --no-default-features
        fi

    - name: Run tests (release mode)
      shell: bash
      run: |
        if [ "${{ matrix.hdf5 }}" == 'YES' ]; then
          cargo nextest run --locked --release
        else
          cargo nextest run --locked --no-default-features --release
        fi

    - name: Run doc tests # nextest does not support doc tests, thus running them separately
      shell: bash
      run: |
        if [ "${{ matrix.hdf5 }}" == 'YES' ]; then
          cargo test --locked --doc
        else
          cargo test --locked --no-default-features --doc
        fi

    - name: Check Docs # docs need dependencies to be installed, thus checking them after installing dependencies
      if: ${{ matrix.hdf5 == 'YES' }}
      shell: bash
      run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc --locked --no-deps --document-private-items

  python-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    name: "Building and testing the python bindings (hdf5: ${{ matrix.hdf5 }})"
    strategy:
      fail-fast: false
      matrix:
        hdf5: [YES, NO]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        components: clippy

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: "python-bindings-${{ matrix.hdf5 }}"

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.x"

    - name: Install HDF5 (apt) # the wheel links against it, the bindings enable the feature
      if: ${{ matrix.hdf5 == 'YES' }}
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get remove -y man-db || true # to speed up
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libhdf5-dev

    - name: Run clippy # not covered by the job above, which builds the core crate only
      run: |
        if [ "${{ matrix.hdf5 }}" == 'YES' ]; then
          cargo clippy --locked -p xdmf-python --all-targets -- -D warnings
        else
          cargo clippy --locked -p xdmf-python --all-targets --no-default-features -- -D warnings
        fi

    - name: Install the bindings
      env: # how cargo flags reach maturin through pip
        MATURIN_PEP517_ARGS: ${{ matrix.hdf5 == 'NO' && '--no-default-features' || '' }}
      run: pip install './python[test]'

    - name: Run tests
      run: pytest python/tests

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    name: "Building and testing a wheel (static HDF5)"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: "wheel-static" # also caches the from-source HDF5, which builds under target/

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.x"

    - name: Install maturin
      run: pip install maturin pytest h5py numpy

    - name: Build the wheel the way the release does # minus the manylinux container and --release
      working-directory: python
      run: maturin build --out dist --features pyo3/extension-module,hdf5-static

    - name: Install it and run the tests against it
      run: |
        pip install --no-index --find-links python/dist xdmf
        python -c "import xdmf; assert xdmf.is_hdf5_enabled(), 'no HDF5 in the wheel'"
        pytest python/tests

  sdist: # a wheel built from the source distribution, as `release.yml` does it
    uses: ./.github/workflows/sdist.yml

  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        toolchain: nightly
        components: rustfmt

    - name: Check formatting
      run: cargo +nightly fmt --all --check

  spelling:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Check spelling
      uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
