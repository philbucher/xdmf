name: Actions static analysis

permissions: {}

on:
  pull_request:
    branches: [ "main" ]

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      security-events: write # to upload the SARIF results to the Security tab
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
      with:
        github_token: ${{ github.token }}
        fail_level: error # otherwise reviewdog only comments and always exits 0
