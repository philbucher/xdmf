name: Actions static analysis

permissions: {}

on:
  pull_request:
    branches: [ "main" ]

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      security-events: write # to upload the SARIF results to the Security tab
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: reviewdog/action-actionlint@3cbf14efd750961dba35fccbf00f9e14028cb1f5 # v1.80.2
      with:
        github_token: ${{ github.token }}
        fail_level: error # otherwise reviewdog only comments and always exits 0
