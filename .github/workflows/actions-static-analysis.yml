name: Actions static analysis

permissions: {}

on:
  pull_request:
    branches: [ "main" ]

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      security-events: write # to upload the SARIF results to the Security tab
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: reviewdog/action-actionlint@7abf25e1607ec65838b73d0484ff31f8e9499d80 # v1.81.2
      with:
        github_token: ${{ github.token }}
        fail_level: error # otherwise reviewdog only comments and always exits 0
