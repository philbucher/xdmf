name: Sdist

permissions:
  contents: read

on:
  workflow_call:

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    name: "Building a wheel from the sdist"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.x"

    # the build below runs on the host, not in a container
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: "sdist" # also caches the from-source HDF5, which builds under target/

    - name: Build the sdist
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
      with:
        working-directory: python
        command: sdist
        args: --out dist

    - name: Build a wheel from the sdist # it has to carry the core crate, which lives above it
      env:
        # pip builds the sdist in a temporary directory, so point cargo back at the cached target
        # directory -- what that saves is the from-source HDF5, whose crate is path-independent.
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake
        python -m pip install --upgrade pip
        python -m pip install ./python/dist/*.tar.gz --config-settings=build-args='--features pyo3/extension-module,hdf5-static'
        python -c "import xdmf; assert xdmf.is_hdf5_enabled()"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: sdist
        path: python/dist/*.tar.gz
