name: Zizmor

permissions: {}

on:
  pull_request:
    branches: [ "main" ]

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      security-events: write # to upload the SARIF results to the Security tab
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
